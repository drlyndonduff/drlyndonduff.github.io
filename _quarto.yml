project:
  type: website

website:
  title: "Dr. Lyndon B. Duff"
  description: "Behavioural ecologist studying social organization, dispersal and social evolution in carpenter bees."
  site-url: https://drlyndonduff.github.io
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  back-to-top-navigation: true
  page-navigation: false

  navbar:
    # Collapse to the menu button below 1200 px so the seven links never
    # crowd or wrap over each other on tablets and small laptops
    collapse-below: xl
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: gallery.qmd
        text: Gallery
      - href: cv.qmd
        text: CV
      - href: news_and_outreach.qmd
        text: News & Outreach
      - href: contact.qmd
        text: Contact
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=rIDnf2UAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: person-badge-fill
        href: https://orcid.org/0000-0001-9939-5417
        aria-label: ORCID

  page-footer:
    left: "© 2026 Dr. Lyndon B. Duff · University of Victoria"
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=rIDnf2UAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: person-badge-fill
        href: https://orcid.org/0000-0001-9939-5417
        aria-label: ORCID
      - icon: journal-text
        href: https://www.researchgate.net/profile/Lyndon-Duff
        aria-label: ResearchGate
      - icon: building
        href: https://www.uvic.ca/science/biology/people/instructors/index.php
        aria-label: University of Victoria

format:
  html:
    theme: [cosmo, theme.scss]
    title-block-banner: true
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

execute:
  freeze: auto
